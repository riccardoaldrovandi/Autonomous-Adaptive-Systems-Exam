env:
  game: "Hunt"              # Hunt | Harvest | Escalation
  grid_size: [5, 5]
  obs_type: "coords"        # coords | image
  max_timesteps: 1000
  enable_multiagent: true
  flip_obs: true

a2c:
  lr: 1.0e-3
  gamma: 0.99
  n_steps: 5                # update every N steps (n-step return)
  entropy_coef: 0.1           # c2: weight for entropy bonus
  value_coef: 0.5           # c1: weight for critic loss

ppo:
  lr: 3.0e-4
  gamma: 0.99
  lam: 0.95                 # lambda for GAE
  eps_clip: 0.2             # clipping range
  n_epochs: 4               # K optimization epochs per rollout
  n_steps: 256              # rollout length before update
  entropy_coef: 0.01
  value_coef: 0.5
  max_updates: 10000        # for linear LR decay

mappo:
  lr: 3.0e-4
  gamma: 0.99
  lam: 0.95
  eps_clip: 0.2
  n_epochs: 4
  n_steps: 256
  entropy_coef: 0.01
  value_coef: 0.5
  max_updates: 10000

training:
  n_episodes: 5000
  eval_every: 10           # run evaluation every N episodes

eval:
  n_episodes: 100
  render: false

logging:
  results_dir: "results"
  save_model: true
